# jul6art/core-bundle — briques communes (abstractions manager/repository,
# voter, événements, traits de service, soft delete, purge, chiffrement au repos).
# Les options `email_debug*` sont aussi exposées en paramètres de conteneur
# préfixés « core. » ; `encryption_key` ne l'est volontairement pas, pour que le
# secret n'atterrisse pas dans le conteneur compilé.
core:
    # Envoi des logs critiques par e-mail (Monolog + Mailer) : à activer en prod
    # en renseignant les trois options suivantes.
    email_debug: false
    email_debug_from: ~
    email_debug_to: ~
    email_debug_title: 'Erreur sur {{PROJECT_TITLE}}'

    # Formatage numérique de tout ce qu'un humain lit (vues, PDF, JSON exposé à une UI).
    # Défauts : virgule décimale et **espace insécable** pour les milliers — un espace
    # normal laisserait un moteur PDF couper un nombre en deux lignes. Filtres Twig :
    # `format_number`, `format_money`, `format_percent`.
    number_format:
        decimal_separator: ','
        decimals: 2

    # Groupement des milliers sur TOUS les NumberType. Opt-in : cela change l'apparence de
    # chaque champ numérique de l'application. Un champ y échappe avec `'grouping' => false`
    # (identifiant numérique par exemple).
    form:
        number_grouping: false

    # Répertoire contre lequel `pdf_image_path()` / `pdf_image_data_uri()` résolvent les
    # chemins d'images destinées à un PDF.
    pdf:
        public_dir: '%kernel.project_dir%/public'

    # En-têtes de sécurité HTTP (nosniff, Referrer-Policy, X-Frame-Options,
    # Permissions-Policy, HSTS) + Content-Security-Policy. Désactivés par défaut dans le
    # bundle : les activer ici est un choix explicite. Garder `csp_enforce: false` le temps
    # de lire les rapports de violation — une CSP appliquée trop tôt casse une page qui
    # marchait. Élargir `csp_policy` dès qu'un hôte tiers est appelé (CDN, EventSource,
    # analytics), sinon le navigateur bloque en silence.
    security_headers:
        enabled: true
        csp_enforce: false
        # csp_policy: "default-src 'self'; connect-src 'self' https://mon-hub.example.com"

    # Captcha arithmétique des formulaires publics (inscription, mot de passe oublié).
    # `generate()` rend la question et remplace la réponse attendue en session : l'appeler à
    # CHAQUE rendu, y compris après un échec. `validate()` consomme la réponse dans tous les
    # cas, donc une bonne réponse ne se rejoue pas.
    captcha:
        operations: ['+']

    # Domaine de traduction des flashes émis par `Controller\AbstractController`. Ce squelette
    # range tous les siens sous `flash.` dans `messages`, donc le défaut suffit et la carte
    # reste vide. Deux conventions, exclusives :
    #   * par préfixe de clé — `domain_map`, le premier préfixe qui correspond gagne, donc
    #     déclarer le plus long d'abord ;
    #   * par contrôleur — surcharger `translationDomain()`, ce qui gagne sur la carte, pour des
    #     catalogues nommés par écran dont les clés ne portent aucun préfixe.
    flash:
        default_domain: 'messages'
        # domain_map:
        #     'organization.domain.': 'domain'   # le préfixe le plus long d'abord
        #     'organization.': 'organization'

    # Nombre de lignes vidées d'un coup par `core:purge`. À baisser si les
    # entités purgées sont lourdes.
    purge:
        batch_size: 100

    # Chiffrement au repos (libsodium) : renseigner une clé de 32 octets encodée
    # en base64 pour activer `Security\Encryptor` et le type Doctrine
    # `encrypted_string`. Tant que la clé est absente, aucun service n'est
    # enregistré. Ne jamais committer la valeur — la lire dans une variable d'env.
    # encryption_key: '%env(APP_ENCRYPTION_KEY)%'
