# Validation messages. The "validators" domain is the one the validator uses.
user:
    email:
        not_blank: Please enter an email address.
        invalid: This email address is not valid.
        unique: An account already exists with this email address.
password:
    not_blank: Please enter a password.
    too_short: The password must be at least {{ limit }} characters long.
    too_weak: 'This password is too weak: make it longer or vary the characters.'
    mismatch: Both passwords must match.
    current_invalid: This does not match your current password.
