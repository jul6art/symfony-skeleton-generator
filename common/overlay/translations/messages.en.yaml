# Interface strings. Keys are dotted and grouped by screen.
nav:
    admin: Back office
    users: Users
    profile: My account
    logout: Sign out
    login: Sign in
    register: Create an account

home:
    subtitle: 'Project generated from the in-house skeleton (%mode%).'
    tailwind:
        title: Tailwind, served locally
        body: 'The Tailwind binary is downloaded by <code>make tailwind</code> and the CSS is compiled inside the project — nothing is fetched from a CDN at runtime.'
    accounts:
        title: Accounts out of the box
        body: 'Sign-up, sign-in, forgotten password, password change and account administration.'

login:
    title: Sign in
    email: Email address
    password: Password
    remember_me: Stay signed in
    submit: Sign in
    forgot: Forgot your password?

register:
    title: Create an account
    submit: Create account
    already: 'Already have an account?'

profile:
    title: My account
    email: Email address
    roles: Roles
    change_password: Change password
    password:
        title: Change password
        current: Current password
        new: New password

reset:
    request:
        title: Reset your password
        help: 'Enter your email address — if an account matches, we will send you a reset link.'
        submit: Send reset link
        back: Back to sign in
    check_email:
        title: Check your email
        body: 'If an account matches that address, a reset link has just been sent. It expires in %duration%.'
        spam: 'Remember to check your spam folder. You can %link% if needed.'
        again: request another link
    new:
        title: New password
        submit: Save
    email:
        subject: Reset your password
        body: 'A password reset was requested for your %app% account. If you did not request it, simply ignore this email.'
        cta: Choose a new password
        expires: 'This link expires in %duration%.'

user:
    email: Email address
    roles: Roles
    role:
        admin: Administrator
        user: User
    roles_help: 'ROLE_USER is implicit — every account has it.'
    password: Password
