admin:
    # ⚠️ Sans cette clé, `@Admin/layout.html.twig` étend la base NUE du bundle : les pages
    # d'administration s'affichent sans la moindre feuille de style, sans erreur nulle part.
    # C'est `templates/base.html.twig` qui porte les tags Encore.
    base_template: 'base.html.twig'
    # Les pages livrées par le bundle (l'écran du profileur) passent par le layout de CE projet :
    # c'est lui qui expose `window.jwtToken` et le reste de la coquille.
    layout_template: 'admin/layout.html.twig'

    branding:
        name: '{{PROJECT_TITLE}}'
        # Chemins d'asset, passés à `asset()`. Déposez vos fichiers dans `public/img/`.
        logo: 'img/logo.png'
        favicon: 'img/favicon.ico'
        home_route: admin_dashboard
        # Largeur du logo (px) sur les pages d'authentification et dans les e-mails ; sans la clé,
        # la hauteur fixe historique s'applique et la largeur suit. `show_name: false` retire le nom
        # écrit sous le logo (pages d'auth) et à côté (barre latérale) : le cas d'un logo qui est
        # déjà un wordmark.
        #
        # La clé est COMMENTÉE et non posée à `~` : l'absence dit la même chose, et un exemple
        # chiffré est plus utile à décommenter qu'un `~` à remplacer.
        #
        # ⚠️ Historique, parce qu'il se reproduirait : jusqu'à `admin-bundle` v1.4.1, ce nœud était
        # un `integerNode()->defaultNull()`, qui REFUSE un null explicite — le défaut ne
        # s'applique qu'en l'ABSENCE de la clé. Le `~` qui était écrit ici faisait échouer TOUT
        # projet généré à la compilation du conteneur (« Expected int, but got null »),
        # `debug:router` compris. Le nœud accepte désormais les deux écritures.
        # logo_width: 360
        show_name: true

    # Une route vide MASQUE le lien correspondant, elle ne casse pas le rendu. C'est ainsi qu'on
    # ferme l'inscription publique : on retire `register`.
    #
    # ⚠️ Cette table est GLOBALE : une route par entrée, pour toute l'application. Le jour où ce
    # projet gagne un second espace où le même écran existe en double — `/admin/account/appearance`
    # et `/portail/account/appearance` — il faut laisser l'entrée VIDE et poser le lien dans le
    # bloc `admin_account_menu_extra` de chaque layout. Une valeur unique enverrait tout le monde
    # au même endroit, et le public de l'autre espace sur un 403 : la page marche, c'est le LIEN
    # qui est faux, et aucun test de contrôleur ne regarde les liens.
    routes:
        login: admin_security_login
        logout: admin_security_logout
        register: admin_security_register
        reset_password_request: admin_reset_password_request
        change_password: admin_account_password_edit
        appearance: admin_account_appearance_edit
        profile: admin_account_profile_edit
        privacy: ''

    mercure:
        hub_url: '%env(MERCURE_PUBLIC_URL)%'
        token_route: admin_mercure_token

when@dev:
    admin:
        routes:
            # L'écran du profileur n'existe qu'en développement (ses routes ne sont importées que
            # là) : renseigner la clé ici suffit à ne montrer le lien que dans cet environnement,
            # une route vide masquant l'entrée ailleurs.
            performance: admin_performance_dashboard
