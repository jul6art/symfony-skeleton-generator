admin:
    branding:
        name: '{{PROJECT_TITLE}}'
        # Chemins d'asset, passés à `asset()`. Déposez vos fichiers dans `public/img/`.
        logo: 'img/logo.png'
        favicon: 'img/favicon.ico'
        home_route: admin_dashboard

    # Une route vide MASQUE le lien correspondant, elle ne casse pas le rendu. C'est ainsi qu'on
    # ferme l'inscription publique : on retire `register`.
    routes:
        login: admin_security_login
        logout: admin_security_logout
        register: admin_security_register
        reset_password_request: admin_reset_password_request
        change_password: admin_account_password_edit
        appearance: admin_account_appearance_edit
        profile: ''
        privacy: ''

    mercure:
        hub_url: '%env(MERCURE_PUBLIC_URL)%'
        token_route: admin_mercure_token
