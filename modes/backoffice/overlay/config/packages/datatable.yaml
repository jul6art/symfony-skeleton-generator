datatable:
    # Le domaine des clés `datatable.*`, donc les fichiers `translations/datatable.{fr,en}.yaml`.
    # Sans cette clé le bundle retombe sur `messages` — ce que la règle §4 de `claude_core.md`
    # traite comme une erreur bloquante, et ce qui rendrait la clé brute dans chaque panneau.
    # Les cartes de `status_maps` en héritent : inutile de le répéter.
    #
    # ⚠️ Le catalogue lui-même vient de la brique « comptes » (`overlay-user/`), qui est aussi celle
    # qui apporte le seul tableau du mode. Sans elle, cette clé est inerte : rien ne rend de table.
    translation_domain: datatable

    # L'identifiant Stimulus vient du CHEMIN de `assets/controllers/core/datatable_controller.js`,
    # que `bootstrap.js` traduit en `core--datatable`. Les deux doivent dire la même chose : un
    # contrôleur Stimulus qui ne reçoit aucune valeur ne lève pas, il rend un tableau vide.
    stimulus_identifier: 'core--datatable'

    csrf:
        single: datatable_action
        bulk: bulk_action

    # Les cartes d'énumérations lues par les rendus de badge. `key_prefix` vaut `datatable.<nom>.`
    # par défaut, et c'est la clé du CATALOGUE — la même chaîne que le `labelPath` passé à
    # `badge()` dans `assets/datatable/renderers.js`. Les deux vont par paires.
    #
    # ⚠️ Elles ne TRANSPORTENT plus rien depuis `datatable-bundle` v2 : elles DÉCLARENT. Le
    # navigateur a le catalogue entier ; ce registre sert au garde de traduction
    # (`tests/Translation/JsTranslationTest.php`), qui ne saurait pas autrement que ces clés sont
    # vivantes — aucun littéral du JavaScript ne les nomme, `badge()` les construit par
    # interpolation.
    status_maps:
        # Lue par le rendu `roleBadges` (`assets/datatable/renderers.js`). Les deux vont par
        # paires : un nom inconnu du registre afficherait la valeur brute, et une carte sans son
        # rendu ne servirait à personne.
        user_role:
            keys: [ROLE_ADMIN, ROLE_SUPER_ADMIN]

    # Application mono-locataire : pas de colonne inter-tenants, donc pas d'endpoint.
    tenant:
        endpoint: ''
