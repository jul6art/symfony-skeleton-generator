api_platform:
    title: '{{PROJECT_TITLE}} API'
    version: '1.0.0'
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    defaults:
        # ⚠️ **Le filet : une opération qui oublie sa `security:` est FERMÉE, pas ouverte**.
        # Personne n'a `ROLE_NOBODY` : sans règle, l'opération répond 403 à tout le
        # monde, au lieu d'être lisible par tout compte qui passe l'`access_control`. Ce n'est qu'un
        # filet — chaque opération déclare sa décision. Les ressources d'erreur d'API Platform
        # (`/errors`, `/validation_errors`) ne le reçoivent pas.
        security: "is_granted('ROLE_NOBODY')"
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
        pagination_client_items_per_page: true
        # ⚠️ Le nom du paramètre de taille de page est un contrat avec le front : le contrôleur de
        # datatable envoie `size`. Le renommer vide toutes les tables d'un coup.
        pagination_items_per_page: 25
        pagination_maximum_items_per_page: 100
    collection:
        pagination:
            items_per_page_parameter_name: size
