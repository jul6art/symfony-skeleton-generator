symfonycasts_reset_password:
    request_password_repository: App\Repository\ResetPasswordRequestRepository
    # ⚠️ Durée de vie et étranglement DÉCOUPLÉS.
    #
    # Les deux valent 3600 s par défaut, ce qui donne le pire cas : le lien expire exactement
    # quand l'étranglement se libère, et entre les deux la personne n'a ni lien valide ni moyen
    # d'en obtenir un — l'écran lui répond pourtant « un lien vient d'être envoyé », puisque la
    # réponse ne doit rien révéler de l'existence du compte.
    lifetime: 3600        # le lien vit une heure
    throttle_limit: 900   # on peut en redemander un au bout de quinze minutes

