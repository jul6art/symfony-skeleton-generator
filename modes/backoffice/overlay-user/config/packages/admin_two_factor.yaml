# La double authentification (admin-bundle, `admin.two_factor`) : PROPOSÉE à chaque compte depuis son menu
# (l'entrée vient de `admin.routes.two_factor`, dont le défaut est `admin_account_two_factor`), jamais
# imposée. `required: true` l'imposerait à tous : un compte sans second facteur serait renvoyé sur l'écran
# d'enrôlement avant toute autre page.
#
# Un fichier à part, dans la brique « comptes » : le second facteur n'a de sens qu'avec des comptes.
admin:
    two_factor:
        enabled: true
        required: false
        # Dix codes à usage unique pour un téléphone perdu, montrés une fois à l'activation ; un code de
        # secours vaut un code en cours à la connexion et sur l'écran du compte.
        backup_codes: true

# Le secret TOTP de chaque compte est stocké CHIFFRÉ (admin-bundle 1.39) : il faut la clé de core-bundle et
# le type Doctrine qui chiffre la colonne — sans eux, le conteneur ne se compile pas, et aucune commande
# console ne démarre. La clé vit dans l'environnement : celle du poste dans .env.dev et .env.test, tirée à
# la création du projet ; celle du serveur dans son .env.local. ⚠️ Perdue, chaque compte doit réactiver
# son second facteur : elle se sauvegarde avec la base.
core:
    encryption_key: '%env(APP_ENCRYPTION_KEY)%'

doctrine:
    dbal:
        types:
            encrypted_string: Jul6Art\CoreBundle\Doctrine\Type\EncryptedStringType

when@dev:
    admin:
        # Le lien de connexion de développement (`app:dev:login-link`) n'est pas soumis au code : il sert
        # à parcourir les écrans sous n'importe quel compte de fixtures, et n'existe qu'ici.
        two_factor:
            exempt_routes: [dev_login_link_check]
