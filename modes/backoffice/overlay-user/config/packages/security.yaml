security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api:
            pattern: ^/api
            stateless: true
            # Les datatables lisent l'API avec le JWT du compte connecté, exposé au front par
            # `jwt_token()`. Le contexte est le même que celui de la session : ce n'est pas une API
            # publique, c'est le back-office qui lit ses propres données.
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: admin_security_login
                check_path: admin_security_login
                default_target_path: admin_dashboard
                enable_csrf: true
            # Cinq tentatives par minute, par couple (identifiant, IP). Le limiteur intégré, et non
            # une `RateLimiterFactory` maison : `login_throttling` attend un
            # `RequestRateLimiterInterface`.
            login_throttling:
                max_attempts: 5
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
            logout:
                path: admin_security_logout
                target: admin_security_login
            switch_user:
                role: ROLE_SUPER_ADMIN
                parameter: _switch_user

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        # La ceinture. La bretelle, c'est la décision explicite que porte chaque route — un
        # `access_control` qui filtre par préfixe ne sait rien des permissions fines.
        - { path: ^/admin, roles: ROLE_USER }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Hachage volontairement faible en test : `auto` coûte ~100 ms par compte créé, ce qui
            # se compte en minutes sur une suite qui en crée des centaines.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

# ── Connexion sans mot de passe, en DÉVELOPPEMENT uniquement ────────────────────────────────────
#
# Ouvre une session à partir d'une URL signée, fabriquée en console :
#
#     symfony console app:dev:login-link manager@example.test
#
# Sert à regarder les écrans tourner avec n'importe quel compte de fixtures — sans avoir à taper
# d'identifiants, et sans jamais faire transiter de mot de passe.
#
# ⚠️ `when@dev` est la garde, et elle est double : la ROUTE est déclarée sous `when@dev`
# (`config/routes/dev_login_link.yaml`) et le contrôleur comme la commande portent `#[When('dev')]`.
# Une route qui authentifie sur simple présentation d'une signature n'a rien à faire ailleurs.
# `DevLoginLinkTest` vérifie qu'aucune des deux n'existe hors développement.
#
# ⚠️ `signature_properties: ['id', 'password']` : inclure le hachage du mot de passe invalide tous
# les liens en cours dès que le mot de passe change. Sans lui, un lien fabriqué avant une
# réinitialisation resterait valable après.
#
# ⚠️ `DEFAULT_URI` (`.env`) doit porter le VRAI hôte du projet : l'URL est fabriquée hors requête,
# donc c'est lui qui en donne le schéma et le domaine. Laissé au défaut de la recipe
# (`http://localhost`), le lien sort inutilisable — défaut trouvé dans superp le 2026-08-25.
when@dev:
    security:
        firewalls:
            main:
                login_link:
                    check_route: dev_login_link_check
                    signature_properties: ['id', 'password']
                    lifetime: 900
                    max_uses: 1
