# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# Point d'entrée de la configuration des services du projet. Les fichiers de `packages/`
# configurent les dépendances ; ici ne vivent que les services de `src/` et les scalaires que
# l'autowire ne sait pas résoudre.
parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    # ⚠️ Un argument scalaire non typé-service ne s'autowire pas : tout `bool`/`string` de
    # constructeur doit être câblé ici explicitement, via `%env(...)%`. L'oublier ne se voit qu'au
    # boot — « Cannot autowire … you should configure its value explicitly » — donc jamais dans un
    # simple `php -l`.

    # Le vérificateur de compte de TOUS les pare-feux : un compte désactivé ne s'authentifie nulle part.
    # ⚠️ Un alias et non un `user_checker:` par pare-feu : un pare-feu ajouté demain en hérite sans
    # qu'on y pense. Voir `App\Security\UserChecker`.
    security.user_checker: '@App\Security\UserChecker'

    # ── Un seul dialecte CSV pour le produit : `excelFr`, à l'écriture ET à la lecture ───────────
    #
    # ⚠️ Le bundle enregistre `CsvWriter` et `CsvReader` sur le dialecte nu de `CsvDialect` (RFC 4180 :
    # virgule, sans marque d'ordre des octets). Or l'export des comptes est OUVERT par un
    # administrateur dans un Excel français, où la virgule est le séparateur décimal : sans ce
    # câblage, le fichier tient dans une seule colonne et « Hélène » s'affiche « HÃ©lÃ¨ne ». Le même
    # tableur, renvoyé tel quel à l'import, se lirait comme une colonne géante.
    #
    # ⚠️ Le MÊME dialecte des deux côtés, et ce n'est pas une coïncidence : le fichier qu'un
    # administrateur réimporte le plus naturellement est celui que le produit vient d'exporter.
    # C'est le réglage de `superp`, dont ce mode est issu.
    #
    # ⚠️ Pas de `tags:` : `autoconfigure: true` applique déjà `dataflow.tabular_writer` et
    # `dataflow.tabular_reader` (le bundle les déclare par `registerForAutoconfiguration()`) — les
    # redire ferait un doublon du même tag sur le même service. Un fichier destiné à un AUTRE
    # programme (un import comptable, un format imposé) construit son écrivain sur son site d'appel,
    # où le destinataire se lit.
    Jul6Art\DataflowBundle\Io\Writer\CsvWriter:
        arguments:
            $dialect: '@App\Io\ExcelFrDialect'

    Jul6Art\DataflowBundle\Io\Reader\CsvReader:
        arguments:
            $dialect: '@App\Io\ExcelFrDialect'

    App\Io\ExcelFrDialect:
        class: Jul6Art\DataflowBundle\Io\Dialect\CsvDialect
        factory: ['Jul6Art\DataflowBundle\Io\Dialect\CsvDialect', 'excelFr']
