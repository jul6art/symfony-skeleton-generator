      column: Colonne du fichier
      field: Correspond à
      ignore: — ignorer cette colonne —
      missing: 'Aucune colonne ne fournit : %fields%'
      unknown: non reconnue, elle sera ignorée
    result:
      dry_run: 'Rien n''a été écrit : c''était une simulation.'
      errors: '%count% ligne(s) en erreur'
      imported: '%count% ligne(s) importée(s)'
