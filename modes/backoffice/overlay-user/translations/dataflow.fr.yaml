      upload_failed: 'Le fichier n''a pas pu être déposé. Réessayez.'
      file_too_large: 'Le fichier est trop lourd.'
      invalid_mime: 'Ce fichier n''est pas un fichier CSV.'
      invalid_csrf: 'Le formulaire a expiré. Réessayez.'
      file_expired: 'Le fichier déposé n''est plus disponible. Déposez-le à nouveau.'
      mapping_required: 'Associez au moins une colonne à un champ.'
      mapping_duplicate: 'Deux colonnes sont associées au même champ : n''en gardez qu''une.'
      mapping_missing: 'Ces champs ont besoin d''une colonne : %fields%.'
      batch_failed: 'L''import s''est arrêté : un lot n''a pas pu être écrit.'
      binary_spreadsheet: C'est un classeur, pas un fichier texte. Enregistrez-le en CSV et réessayez.
      duplicate: Cet enregistrement existe déjà.
      empty_file: Le fichier est vide.
      file_unreadable: Le fichier n'a pas pu être ouvert.
      row_cap_reached: Le fichier dépasse le nombre de lignes autorisé ; le reste n'a pas été lu.
