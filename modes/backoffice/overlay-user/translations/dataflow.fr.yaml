# Les libellés SERVEUR des partiels d'import de `jul6art/dataflow-bundle` (`_mapper.html.twig`,
# `_report.html.twig`) — utilisés par l'exemple d'import du mode `backoffice`.
#
# ⚠️ Le bundle livre son catalogue en anglais (`Resources/translations/dataflow.en.xlf`) ; Symfony
# fusionne ce fichier-ci par-dessus pour la locale française, que ce mode supporte aussi
# (`BackofficeLocales::SUPPORTED`). Rien à ajouter côté anglais : c'est la langue par défaut de ce
# mode, et le catalogue du bundle la couvre déjà.
dataflow:
  import:
    screen:
      file: 'Fichier'
      choose: 'Choisissez un fichier'
      or_drop: 'ou glissez-le ici'
      accept: 'CSV, avec une ligne d''en-têtes'
      hint: 'Colonnes reconnues : %fields%.'
      template: 'Télécharger le modèle'
      upload: 'Déposer'
      cancel: 'Annuler'
      back: 'Retour'
      mapping: 'Colonnes'
      run: 'Lancer l''import'
      run_counted: 'Importer : %creations% à créer, %updates% à mettre à jour'
      other_file: 'Un autre fichier'
      batch_failed: 'L''import s''est arrêté à l''enregistrement %record% : un lot n''a pas pu être écrit.'
      rolled_back: 'Rien n''a été gardé : ce qui avait été écrit a été annulé.'
