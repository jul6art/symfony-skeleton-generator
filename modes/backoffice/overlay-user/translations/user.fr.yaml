      batch_failed: 'L''import s''est arrêté : un lot n''a pas pu être écrit (ligne %record%).'
      rolled_back: Tout ce qui était déjà écrit a été annulé.
      partially_committed: Des lots précédents étaient déjà validés et n'ont pas été annulés.
      view_users: Voir les utilisateurs
      import_more: Importer un autre fichier
    # ⚠️ Ces trois-là seulement : ce sont les seules levées comme `\DomainException` DANS le
    # mapper (`UserRowMapper::map()`), et rendues par `@Dataflow/import/_report.html.twig` via
    # `error.message|trans({}, error.message|split('.')|first)` — le premier segment avant le point
    # ('user') donne le DOMAINE de traduction. Les erreurs de TÉLÉVERSEMENT (fichier trop gros,
    # MIME refusé…) passent par un flash, pas par ce mécanisme : leurs clés sont dans
    # `messages.fr.yaml`, où `core.flash.domain_map` — vide par défaut dans ce squelette — les
    # cherche.
    error:
