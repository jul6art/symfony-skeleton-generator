# The table foundation's catalogue (`jul6art/datatable-bundle`).
#
# Domain `datatable`, declared by `datatable.translation_domain` in
# `config/packages/datatable.yaml` — NOT in `messages`: rule §4 of `docs/claude/claude_core.md`
# splits translations by functional domain, and falling back to `messages` is a blocking error.
#
# What is deliberately NOT here: the `modal:` tree stays in `messages`. It is the confirmation
# modals' vocabulary, shared by every `ui--modal`, so it reaches far beyond tables.

