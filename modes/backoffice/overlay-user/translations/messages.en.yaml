        access: Access
    dashboard: Dashboard
    users: Users
    role_permissions: Permissions
    profile: My profile
    change_password: Password
    appearance: Appearance
    logout: Sign out

action:
    actions: Actions
    save: Save
    cancel: Cancel
    show: View
    edit: Edit
    delete: Delete
