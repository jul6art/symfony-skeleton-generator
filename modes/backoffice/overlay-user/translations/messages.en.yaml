# File dropzone (form theme, `form_file_dropzone` block). It replaces the browser's own control,
# which renders its labels in the BROWSER's language rather than the application's.
form.file.drop_hint: Drop a file here
form.file.browse: or click to browse
form.file.selected: Selected file
# Appearance preferences saved. The key is emitted by `admin-bundle`, whose toast partial
# translates in `messages`: without this entry it shows up RAW.
appearance.flash.saved: Preferences saved.
# Libellés de la carte `user_role` (config/packages/datatable.yaml), lus par le rendu
# `roleBadges`. Une carte sans ses libellés affiche le code brut dans la cellule.
datatable.user_role.ROLE_ADMIN: Administrator
datatable.user_role.ROLE_SUPER_ADMIN: Super administrator
# Unités de taille de fichier, passées au contrôleur `form--dropzone` : un bundle ne connaît
# pas la langue de l'application qui l'embarque.
form.file.units: B,KB,MB,GB
