# ── The labels the datatable's JavaScript reads ─────────────────────────────
# Pushed into an attribute by `@Datatable/datatable/_translations.html.twig`, never written in the
# JS: no user-facing string lives in a `.js` file.
datatable:
    filters: Filters
    filter_apply: Apply
    filter_reset: Reset
    filter:
        input_too_short: Type at least one character
        searching: Searching…
        no_results: No result
    status:
        active: Active
        inactive: Inactive
    confirm:
        title: Confirm
        message: Do you confirm this action?
        confirm: Confirm
        cancel: Cancel
    error:
        loading: Could not load the data
    coalescence:
        message: Changes came in
        refresh: Refresh
    bulk:
        selected: selected
        choose: Choose an action
        apply: Apply
        clear: Clear selection
    col:
        id: ID

# Confirmation modals per action type. A type declared in `datatable.bulk_actions` without these
# keys is SKIPPED — better than a raw key as a modal title.
modal:
    subject_wrap: '“%subject%”'
    subject_default: this item
    delete:
        title: Delete
        message: This cannot be undone. Delete %subject%?
        confirm: Delete
    activate:
        title: Activate
        message: Activate %subject%?
        confirm: Activate
    deactivate:
        title: Deactivate
        message: Deactivate %subject%?
        confirm: Deactivate
    bulk:
        delete:
            title: Delete selection
            message: This cannot be undone. Delete the selected items?
            confirm: Delete
        activate:
            title: Activate selection
            message: Activate the selected items?
            confirm: Activate
        deactivate:
            title: Deactivate selection
            message: Deactivate the selected items?
            confirm: Deactivate
