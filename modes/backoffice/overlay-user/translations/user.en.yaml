    # MIME refusé…) passent par un flash, pas par ce mécanisme : leurs clés sont dans
    # `messages.en.yaml`, où `core.flash.domain_map` — vide par défaut dans ce squelette — les
    # cherche.
    error:
      missing_fields: A first and last name are required.
      invalid_email: This row's e-mail address is not usable.
      unknown_role: This row's role is not one this application assigns.
