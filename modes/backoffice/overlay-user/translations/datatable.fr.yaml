# Le catalogue du socle de tableau (`jul6art/datatable-bundle`).
#
# Domaine `datatable`, déclaré par `datatable.translation_domain` dans
# `config/packages/datatable.yaml`. Il n'est PAS dans `messages` : la règle §4 de
# `docs/claude/claude_core.md` répartit les traductions par domaine fonctionnel, et y retomber par
# défaut est une erreur bloquante. Le bundle lit ce domaine depuis la v1.2 — il ne code plus
# `messages` en dur.
#
# Ce qui n'est PAS ici, à dessein : le tree `modal:` reste dans `messages`. C'est le vocabulaire des
# modales de confirmation, partagé par tous les `ui--modal`, donc bien au-delà des tableaux.

datatable:
  col:
    id: ID
