# Mode « backoffice » : symfony new --webapp + API Platform + Mercure + les bundles maison.
#
# C'est le back-office de `superp` ramené à un seul locataire : même thème, mêmes modales de
# confirmation, mêmes datatables (API Platform côté données, Mercure pour le rafraîchissement),
# même moteur de permissions — sans les organisations.
DESCRIPTION="Back-office maison (thème SupERP, datatables API Platform + Mercure, ACL)"
SYMFONY_NEW_FLAGS="--webapp"
# Le sujet du mode, ce sont les comptes et leurs permissions : --no-user n'y a pas de sens.
REQUIRES_USER=1
NEXT_STEPS='    make db-create db-diff db-migrate            # schéma initial
    make assets                                  # npm install + build (ce mode utilise Encore)'
NEXT_STEPS_USER='    make user-create ARGS="moi@exemple.com --admin"  # premier administrateur
    make start                                   # puis /admin'
