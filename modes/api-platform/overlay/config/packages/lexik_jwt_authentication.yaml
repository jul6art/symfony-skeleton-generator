lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    # Durée de vie du jeton (en secondes) : court par défaut, à compléter par un
    # refresh token si le client en a besoin.
    token_ttl: 3600

    # Documente POST /api/login dans la spec OpenAPI : la route est servie par
    # le pare-feu, API Platform ne peut pas la découvrir seule. Le chemin doit
    # être écrit tel quel (et non le nom de route), c'est lui qui apparaît.
    api_platform:
        enabled: true
        check_path: /api/login
        username_path: email
        password_path: password
