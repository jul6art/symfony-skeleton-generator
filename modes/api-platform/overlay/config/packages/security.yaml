security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Profileur et assets statiques toujours servis.
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # POST /api/login : échange e-mail + mot de passe contre un JWT.
        login:
            pattern: ^/api/login$
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        # Le reste de l'API : jeton porté par l'en-tête Authorization: Bearer …
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

        # Hors /api : /health uniquement, accessible sans jeton.
        main:
            pattern: ^/
            lazy: true
            stateless: true
            provider: app_user_provider

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    # La sécurité fine est portée par les opérations (`security:` des
    # #[ApiResource]) ; ces règles ne font qu'ouvrir ce qui doit l'être.
    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        # Documentation ouverte : à fermer si l'API n'est pas publique.
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/\.well-known, roles: PUBLIC_ACCESS }
        - { path: ^/api$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Hachage volontairement faible pour ne pas ralentir la suite de tests.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
