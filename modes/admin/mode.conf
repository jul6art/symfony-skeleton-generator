# Mode « admin » : symfony new --webapp + EasyAdmin, front Tailwind du mode web.
DESCRIPTION="Back-office EasyAdmin (Tailwind en façade, comptes et CRUD fournis)"
SYMFONY_NEW_FLAGS="--webapp"
# Le back-office n'a pas de sens sans comptes : --no-user y est refusé.
REQUIRES_USER=1
NEXT_STEPS='    make db-create db-diff db-migrate            # schéma initial'
NEXT_STEPS_USER='    make user-create ARGS="moi@exemple.com --admin"  # premier administrateur
    make admin                                   # ouvre le back-office (/admin)'
